
name: Crear Juramento EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar Juramento
        run: npm run dist

      - name: Guardar EXE
        uses: actions/upload-artifact@v4
        with:
          name: Juramento-Windows
          path: dist/*.exe
