name = "juramento-coop"
main = "cloudflare/worker.js"
compatibility_date = "2026-10-17"
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[[durable_objects.bindings]]
name = "JURAMENTO_HUB"
class_name = "JuramentoHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JuramentoHub"]
